plugins {
    id 'java-library'
    alias libs.plugins.shadow
    alias libs.plugins.lombok
}

description = 'OpenAudioMc Skywars Integration'

dependencies {
    compileOnly project(':OpenAudioMc:API')
    compileOnly project(':OpenAudioMc:Plugin')
    compileOnly libs.spigot.api
    compileOnly libs.skywars.reloaded
}

// Everything this hook needs is provided at runtime, so there is nothing to relocate
shadowJar {
    archiveBaseName = 'skywars-hook'
    archiveClassifier = ''
}

processResources {
    def oaVersion = project.version.toString()
    filter { line -> line.replace('${oa.version}', oaVersion) }
}

jar {
    enabled = false
}
