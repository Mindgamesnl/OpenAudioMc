import dev.s7a.gradle.minecraft.server.tasks.LaunchMinecraftServerTask
import com.github.jengelman.gradle.plugins.shadow.transformers.AppendingTransformer

plugins {
    id 'java-library'
    alias libs.plugins.shadow
    alias libs.plugins.lombok
    alias libs.plugins.minecraft.server
}

apply from: "$rootDir/gradle/publish-conventions.gradle"

description = 'OpenAudioMc Plugin'

dependencies {
    // Shaded into the plugin jar
    implementation libs.nbt.api
    implementation(libs.storm) {
        // Storm leaks Lombok onto its runtime classpath with a dynamic version
        exclude group: 'org.projectlombok'
    }
    implementation libs.snakeyaml
    implementation(libs.okhttp) {
        exclude group: 'com.google.android', module: 'android'
    }
    implementation libs.socketio.client
    implementation libs.lettuce.core
    implementation libs.sqlite.jdbc

    implementation project(':OpenAudioMc:API')
    implementation project(':OpenAudioMc:OA-LegacySkullUtil')
    implementation project(':OpenAudioMc:OA-ModernSkullUtil')
    implementation project(':OpenAudioMc:OA-WorldguardIntegration')
    implementation project(':OpenAudioMc:OA-WorldGuardLegacy')
    implementation project(':OpenAudioMc:OA-WorldGuardModern')

    // Provided by the platform at runtime
    compileOnly libs.spigot.api
    compileOnly libs.bungee.proxy
    compileOnly libs.bungee.protocol
    compileOnly libs.bungee.api
    compileOnly libs.traincarts
    compileOnly libs.bkcommonlib
    compileOnly libs.velocity.api
    compileOnly libs.litebans.api
    compileOnly(libs.essentialsx) {
        // Pulls a Java 21 paper-api that Gradle rejects for our Java 8 target
        exclude group: 'io.papermc.paper'
    }
    compileOnly libs.placeholderapi

    testImplementation libs.wisp
    testImplementation libs.junit
}

java {
    withSourcesJar()
    withJavadocJar()
}

shadowJar {
    archiveBaseName = 'openaudiomc'
    archiveClassifier = ''

    relocate 'de.tr7zw.changeme.nbtapi', 'com.craftmend.thirdparty.nbt'
    relocate 'io', 'com.craftmend.thirdparty.io', {
        // Netty channel types cross the plugin boundary when talking to BungeeCord
        exclude 'io.netty.channel.Channel'
        exclude 'io.netty.channel.ChannelPipeline'
        exclude 'io.netty.channel.ChannelHandler'
    }
    relocate 'org.json', 'com.craftmend.thirdparty.json'
    relocate 'reactor', 'com.craftmend.thirdparty.reactor'
    relocate 'okhttp3', 'com.craftmend.thirdparty.okhttp3'
    relocate 'okio', 'com.craftmend.thirdparty.okio'
    relocate 'org.mapdb', 'com.craftmend.thirdparty.mapdb'
    relocate 'kotlin', 'com.craftmend.thirdparty.kotlin'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'

    mergeServiceFiles()

    transform(AppendingTransformer) {
        resource = 'META-INF/spring.handlers'
    }
    transform(AppendingTransformer) {
        resource = 'META-INF/spring.schemas'
    }
}

jar {
    archiveBaseName = 'openaudiomc'
    archiveClassifier = 'thin'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

build {
    dependsOn shadowJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = project.group
            artifactId = 'openaudiomc'
            version = project.version
        }
    }
}

[
        ['8', '1.8.8'],
        ['12', '1.12.2'],
        ['20', '1.20.4'],
        ['21', '1.21.7'],
        ['2110', '1.21.10'],
        ['2111', '1.21.11']
].each { name, version ->
    tasks.register("testPlugin$name", LaunchMinecraftServerTask) {
        dependsOn tasks.shadowJar

        def serverDir = layout.buildDirectory.dir("MinecraftServer$name")
        def pluginJar = tasks.shadowJar.archiveFile

        doFirst {
            copy {
                from pluginJar
                into serverDir.get().dir('plugins')
            }
        }

        serverDirectory = serverDir.get().asFile.path
//        jarUrl = LaunchMinecraftServerTask.JarUrl.Paper(version)
        agreeEula = true
    }
}

tasks.register('testPluginBungee', LaunchMinecraftServerTask) {
    dependsOn tasks.shadowJar

    def serverDir = layout.buildDirectory.dir('BungeeServer')
    def pluginJar = tasks.shadowJar.archiveFile

    doFirst {
        copy {
            from pluginJar
            into serverDir.get().dir('plugins')
        }
    }

    serverDirectory = serverDir.get().asFile.path
    agreeEula = true
}

def generatedResources = layout.buildDirectory.dir('generated/resources/buildinfo')

def generateBuildInfo = tasks.register('generateBuildInfo') {
    description = 'Increments the build counter and writes openaudiomc-build.properties'
    group = 'build'

    def counterFile = file('src/main/bash/data.bin')
    def outputDir = generatedResources
    def commit = providers.exec {
        commandLine 'git', 'rev-parse', 'HEAD'
    }.standardOutput.asText.map { it.trim() }
    def author = providers.exec {
        commandLine 'git', 'log', '-1', '--pretty=format:%an'
    }.standardOutput.asText.map { it.trim() }

    outputs.dir outputDir
    outputs.upToDateWhen { false }

    doLast {
        def counter = counterFile.exists() ? counterFile.text : ''
        def match = counter =~ /BUILD_NUM\s*=\s*"?(\d+)"?/
        def buildNumber = (match ? match[0][1].toInteger() : 0) + 1

        counterFile.parentFile.mkdirs()
        counterFile.text = "BUILD_NUM=\"${buildNumber}\"\n"

        def target = outputDir.get().asFile
        target.mkdirs()
        new File(target, 'openaudiomc-build.properties').text = """\
            |BUILD_VERSION="${buildNumber}"
            |BUILD_COMMIT="${commit.getOrElse('unknown')}"
            |BUILD_AUTHOR="${author.getOrElse('unknown')}"
            |""".stripMargin()
    }
}

sourceSets.main.resources.srcDir generateBuildInfo

def replaceableExtensions = ['java', 'kt', 'json', 'txt', 'html', 'xml', 'properties', 'yml', 'yaml']

tasks.register('replaceVersionPlaceholders') {
    description = 'Replaces @OA_VERSION@ in all source and resource files with the project version'
    group = 'build'

    def sourceDirs = ['src/main/java', 'src/main/resources', 'src/test/java', 'src/test/resources'].collect { file(it) }
    def replacement = project.version.toString()

    doLast {
        sourceDirs.findAll { it.exists() }.each { dir ->
            dir.eachFileRecurse { candidate ->
                if (!candidate.isFile() || !replaceableExtensions.any { candidate.name.endsWith(it) }) return

                def content = candidate.getText('UTF-8')
                def replaced = content.replace('@OA_VERSION@', replacement)
                if (content != replaced) {
                    candidate.write(replaced, 'UTF-8')
                    logger.lifecycle("Updated: $candidate")
                }
            }
        }
    }
}

compileJava.dependsOn tasks.replaceVersionPlaceholders
processResources.dependsOn tasks.replaceVersionPlaceholders
