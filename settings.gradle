pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

rootProject.name = 'OpenAudioMc-Root'

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS

    // Every third party repo is scoped to the groups it actually serves. Several of them
    // answer 500 instead of 404 for unknown artifacts, which aborts resolution outright.
    repositories {
        mavenCentral()

        maven {
            name = 'spigotmc'
            url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
            content {
                includeGroup 'org.spigotmc'
                includeGroup 'org.bukkit'
            }
        }
        maven {
            name = 'papermc'
            url = 'https://repo.papermc.io/repository/maven-public/'
            content {
                includeGroup 'com.destroystokyo.paper'
                includeGroupByRegex 'io\\.papermc(\\..*)?'
                includeGroup 'com.velocitypowered'
                includeGroup 'net.md-5'
            }
        }
        maven {
            name = 'codemc'
            url = 'https://repo.codemc.org/repository/maven-public/'
            content {
                includeGroup 'de.tr7zw'
                includeGroup 'litebans'
            }
        }
        maven {
            name = 'enginehub'
            url = 'https://maven.enginehub.org/repo/'
            content { includeGroupByRegex 'com\\.sk89q(\\..*)?' }
        }
        maven {
            name = 'essentialsx'
            url = 'https://repo.essentialsx.net/releases/'
            content { includeGroup 'net.essentialsx' }
        }
        maven {
            name = 'extendedclip'
            url = 'https://repo.extendedclip.com/releases/'
            content { includeGroup 'me.clip' }
        }
        maven {
            name = 'alessiodp'
            url = 'https://repo.alessiodp.com/releases/'
            content { includeGroupByRegex 'com\\.alessiodp(\\..*)?' }
        }
        maven {
            name = 'gcnt'
            url = 'https://nexuslite.gcnt.net/repos/gcnt'
            content { includeGroup 'net.gcnt' }
        }
        maven {
            name = 'mg-dev'
            url = 'https://ci.mg-dev.eu/plugin/repository/everything'
            content {
                includeGroupByRegex 'com\\.bergerkiller(\\..*)?'
                includeGroup 'me.m56738'
            }
        }
        maven {
            name = 'minecraft-libraries'
            url = 'https://libraries.minecraft.net/'
            content { includeGroup 'com.mojang' }
        }
        maven {
            name = 'jitpack'
            url = 'https://jitpack.io'
            content { includeGroupByRegex 'com\\.github\\..*' }
        }
    }
}

// WorldGuard support, split so a single jar works against both API generations
include ':OpenAudioMc:OA-WorldguardIntegration'
include ':OpenAudioMc:OA-WorldGuardLegacy'
include ':OpenAudioMc:OA-WorldGuardModern'

// Main modules
include ':OpenAudioMc:API'
include ':OpenAudioMc:OA-LegacySkullUtil'
include ':OpenAudioMc:OA-ModernSkullUtil'
include ':OpenAudioMc:Plugin'

// Ported modules
include ':OpenAudioMc:OA-PartiesModule'
include ':OpenAudioMc:OA-SkywarsModule'
include ':OpenAudioMc:OA-VistasClient'
include ':OpenAudioMc:OA-VistasServer'
