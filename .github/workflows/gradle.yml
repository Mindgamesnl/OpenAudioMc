name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tests are excluded: the only suite is a Vistas full stack integration test that
      # needs a local Redis and registers a real account against the production API on
      # every run, so it is not something to fire on each push
      - name: Build
        run: ./gradlew build -x test

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: openaudiomc
          path: OpenAudioMc/Plugin/build/libs/openaudiomc-*.jar
          if-no-files-found: error
