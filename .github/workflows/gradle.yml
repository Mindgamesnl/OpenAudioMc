name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure bogus pixelib gradle credentials
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          pixelibRepoUser=readonly@pixelib.dev
          pixelibRepoToken=none
          EOF
          chmod 600 ~/.gradle/gradle.properties

      # The Vistas integration test skips itself without a local Redis, so it stays out
      # of the way here. See integration-tests.yml for the run that exercises it.
      - name: Build
        run: ./gradlew build

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: openaudiomc
          path: OpenAudioMc/Plugin/build/libs/openaudiomc-*.jar
          if-no-files-found: error
