name: Deploy Javadoc

on:
  push:
    branches:
      - master
      - main
      - development

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get commit author
        id: get-author
        run: |
          echo "name=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "email=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure bogus pixelib gradle credentials
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          pixelibRepoUser=readonly@pixelib.dev
          pixelibRepoToken=none
          EOF
          chmod 600 ~/.gradle/gradle.properties

      - name: Generate Javadoc (API module)
        run: ./gradlew :OpenAudioMc:API:javadoc

      - name: Checkout javadoc branch
        uses: actions/checkout@v5
        with:
          ref: javadoc
          path: javadoc-branch
          clean: true

      - name: Clear existing javadoc
        run: |
          cd javadoc-branch
          git rm -rf javadoc || true
          mkdir -p javadoc

      - name: Copy new javadoc
        run: |
          cp -r OpenAudioMc/API/build/docs/javadoc/* javadoc-branch/javadoc/

      - name: Commit and push javadoc
        run: |
          cd javadoc-branch
          git config --local user.email "${{ steps.get-author.outputs.email }}"
          git config --local user.name "${{ steps.get-author.outputs.name }}"
          git add javadoc
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update Javadoc from ${{ github.sha }}"
          git push origin javadoc
